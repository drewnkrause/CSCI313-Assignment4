<div class="container mt-4 w-50">
  <div class="card shadow-sm">
    <div class="card-body">
      <h4 class="card-title mb-3 text-center">Add Expense</h4>
      <div class="mb-3">
        <label class="form-label">Expense Title</label
        ><input
          type="text"
          placeholder="Enter expense title"
          class="form-control"
          [(ngModel)]="title"
        />
      </div>
      <div class="mb-3">
        <label class="form-label">Amount ($)</label
        ><input
          type="number"
          placeholder="Enter amount"
          class="form-control"
          [(ngModel)]="amount"
        />
      </div>
      <div class="mb-3">
        <label class="form-label">Category</label
        ><select class="form-select" [(ngModel)]="category" value="">
          <option value="" disabled="" selected="">Select category</option>
          @for (category of expenseService.categories(); track $index) {
            <option [value]="category">{{ category }}</option>
          }
        </select>
      </div>
      <div class="d-grid">
        <button class="btn btn-primary" (click)="addExpense()">Add Expense</button>
      </div>
    </div>
  </div>
</div>
